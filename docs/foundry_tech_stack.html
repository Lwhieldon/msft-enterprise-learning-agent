<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compliance Academy — Tech Stack on Microsoft Foundry</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0a1628; color: #f8fafc; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; padding: 2vw; }
  svg { width: 100%; height: 100%; max-width: 1600px; max-height: 900px; }

  /* Service tile base */
  .tile { fill: #1e293b; stroke: #334155; stroke-width: 1; }
  .tier-band { fill: #0f1f3a; stroke: #1e3a5f; stroke-width: 0.5; }

  /* Text styles */
  .tier-label { fill: #60a5fa; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
  .service-name { fill: #f1f5f9; font-size: 17px; font-weight: 600; }
  .service-detail { fill: #94a3b8; font-size: 13px; font-weight: 400; }
  .service-small { fill: #cbd5e1; font-size: 12px; font-weight: 500; }
  .h1 { fill: #f8fafc; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
  .h2 { fill: #94a3b8; font-size: 15px; font-weight: 400; }
  .agent-name { fill: #e2e8f0; font-size: 13px; font-weight: 500; }
  .badge { fill: #60a5fa; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; }

  /* Connectors */
  .flow-line { stroke: #4a90e2; stroke-width: 2; fill: none; }
  .flow-line.dashed { stroke-dasharray: 6 4; }
  .flow-secondary { stroke: #475569; stroke-width: 1; fill: none; }
</style>
</head>
<body>
<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title">
  <title id="diagram-title">Compliance Academy tech stack on Microsoft Foundry Agent Service</title>

  <defs>
    <!-- Microsoft-style service icon gradients -->
    <linearGradient id="foundry-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B5CD6"/>
      <stop offset="100%" stop-color="#4B2E96"/>
    </linearGradient>
    <linearGradient id="openai-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10A37F"/>
      <stop offset="100%" stop-color="#0d7c5f"/>
    </linearGradient>
    <linearGradient id="search-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B8AE2"/>
      <stop offset="100%" stop-color="#1E5FA5"/>
    </linearGradient>
    <linearGradient id="entra-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00B7C3"/>
      <stop offset="100%" stop-color="#007580"/>
    </linearGradient>
    <linearGradient id="chainlit-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F08C2F"/>
      <stop offset="100%" stop-color="#C25E0A"/>
    </linearGradient>
    <linearGradient id="terminal-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4a90e2"/>
    </marker>
  </defs>

  <!-- ======================== HEADER ======================== -->
  <text class="h1" x="800" y="50" text-anchor="middle">Compliance Academy</text>
  <text class="h2" x="800" y="76" text-anchor="middle">Multi-agent cyber-mystery on Microsoft Foundry Agent Service</text>

  <!-- ======================== TIER 1: USER LAYER ======================== -->
  <rect class="tier-band" x="60" y="110" width="1480" height="120" rx="10"/>
  <text class="tier-label" x="80" y="135">USER LAYER</text>

  <!-- Chainlit UI -->
  <g transform="translate(420, 145)">
    <rect class="tile" width="320" height="74" rx="8"/>
    <!-- Chainlit icon (chat bubble) -->
    <rect x="18" y="18" width="38" height="38" rx="7" fill="url(#chainlit-grad)"/>
    <circle cx="29" cy="34" r="2.2" fill="white"/>
    <circle cx="37" cy="34" r="2.2" fill="white"/>
    <circle cx="45" cy="34" r="2.2" fill="white"/>
    <text class="service-name" x="76" y="34">Chainlit UI</text>
    <text class="service-detail" x="76" y="55">Player-facing surface, streaming chat</text>
  </g>

  <!-- Activity Log Terminal -->
  <g transform="translate(860, 145)">
    <rect class="tile" width="320" height="74" rx="8"/>
    <!-- Terminal icon -->
    <rect x="18" y="18" width="38" height="38" rx="5" fill="url(#terminal-grad)"/>
    <text x="22" y="32" fill="white" font-family="monospace" font-size="11" font-weight="700">&gt;_</text>
    <line x1="22" y1="40" x2="48" y2="40" stroke="white" stroke-width="1.5"/>
    <line x1="22" y1="46" x2="40" y2="46" stroke="white" stroke-width="1.5"/>
    <text class="service-name" x="76" y="34">Activity Log Terminal</text>
    <text class="service-detail" x="76" y="55">Live retrieval + model call stream</text>
  </g>

  <!-- ======================== CONNECTORS USER → AGENT SERVICE ======================== -->
  <line class="flow-line" x1="580" y1="225" x2="580" y2="265" marker-end="url(#arrow)"/>
  <line class="flow-line" x1="1020" y1="225" x2="1020" y2="265" marker-end="url(#arrow)"/>

  <!-- ======================== TIER 2: ORCHESTRATION ======================== -->
  <rect class="tier-band" x="60" y="265" width="1480" height="310" rx="10"/>
  <text class="tier-label" x="80" y="290">ORCHESTRATION LAYER</text>

  <!-- Foundry Agent Service header -->
  <g transform="translate(140, 308)">
    <!-- Foundry icon (Microsoft purple star/diamond) -->
    <rect width="56" height="56" rx="10" fill="url(#foundry-grad)"/>
    <path d="M28 12 L36 25 L28 38 L20 25 Z M16 28 L28 20 L40 28 L28 36 Z" fill="white" opacity="0.95"/>
    <text class="service-name" x="72" y="24">Microsoft Foundry Agent Service</text>
    <text class="service-detail" x="72" y="44">Connected Agents pattern · DefaultAzureCredential auth</text>
  </g>

  <!-- Party Agents Group -->
  <g transform="translate(140, 395)">
    <text class="badge" x="0" y="0">PARTY AGENTS · 4</text>

    <!-- Game Master -->
    <g transform="translate(0, 14)">
      <rect width="180" height="58" rx="6" fill="#312e81" stroke="#4f46e5" stroke-width="1"/>
      <circle cx="22" cy="29" r="11" fill="#a78bfa"/>
      <text fill="white" x="22" y="34" text-anchor="middle" font-size="13" font-weight="700">GM</text>
      <text class="agent-name" x="42" y="26">Game Master</text>
      <text class="service-detail" x="42" y="44">Orchestrator</text>
    </g>

    <!-- Forensic Analyst -->
    <g transform="translate(195, 14)">
      <rect width="180" height="58" rx="6" fill="#312e81" stroke="#4f46e5" stroke-width="1"/>
      <circle cx="22" cy="29" r="11" fill="#3b82f6"/>
      <text fill="white" x="22" y="34" text-anchor="middle" font-size="13" font-weight="700">FA</text>
      <text class="agent-name" x="42" y="26">Forensic Analyst</text>
      <text class="service-detail" x="42" y="44">Grounded retrieval</text>
    </g>

    <!-- Compliance Officer -->
    <g transform="translate(390, 14)">
      <rect width="180" height="58" rx="6" fill="#312e81" stroke="#4f46e5" stroke-width="1"/>
      <circle cx="22" cy="29" r="11" fill="#1e40af"/>
      <text fill="white" x="22" y="34" text-anchor="middle" font-size="13" font-weight="700">CO</text>
      <text class="agent-name" x="42" y="26">Compliance Officer</text>
      <text class="service-detail" x="42" y="44">Framework closer</text>
    </g>

    <!-- Scenario Generator -->
    <g transform="translate(585, 14)">
      <rect width="180" height="58" rx="6" fill="#312e81" stroke="#4f46e5" stroke-width="1"/>
      <circle cx="22" cy="29" r="11" fill="#10b981"/>
      <text fill="white" x="22" y="34" text-anchor="middle" font-size="13" font-weight="700">SG</text>
      <text class="agent-name" x="42" y="26">Scenario Generator</text>
      <text class="service-detail" x="42" y="44">Hot-load new cases</text>
    </g>
  </g>

  <!-- Suspect Agents Group -->
  <g transform="translate(900, 395)">
    <text class="badge" x="0" y="0">SUSPECT AGENTS · 5 PER SCENARIO</text>

    <g transform="translate(0, 14)">
      <rect width="540" height="58" rx="6" fill="#3f1d3a" stroke="#9d174d" stroke-width="1"/>
      <g transform="translate(16, 12)">
        <circle cx="16" cy="16" r="14" fill="#d946ef"/>
        <text fill="white" x="16" y="20" text-anchor="middle" font-size="11" font-weight="700">AC</text>
      </g>
      <g transform="translate(120, 12)">
        <circle cx="16" cy="16" r="14" fill="#22d3ee"/>
        <text fill="white" x="16" y="20" text-anchor="middle" font-size="11" font-weight="700">MW</text>
      </g>
      <g transform="translate(224, 12)">
        <circle cx="16" cy="16" r="14" fill="#fbbf24"/>
        <text fill="white" x="16" y="20" text-anchor="middle" font-size="11" font-weight="700">RP</text>
      </g>
      <g transform="translate(328, 12)">
        <circle cx="16" cy="16" r="14" fill="#34d399"/>
        <text fill="white" x="16" y="20" text-anchor="middle" font-size="11" font-weight="700">CD</text>
      </g>
      <g transform="translate(432, 12)">
        <circle cx="16" cy="16" r="14" fill="#f87171"/>
        <text fill="white" x="16" y="20" text-anchor="middle" font-size="11" font-weight="700">JS</text>
      </g>
      <text class="service-detail" x="270" y="50" text-anchor="middle">Persona-driven (backstory, alibi, leak conditions)</text>
    </g>
  </g>

  <!-- ======================== CONNECTORS AGENTS → SERVICES ======================== -->
  <line class="flow-line" x1="440" y1="540" x2="440" y2="610" marker-end="url(#arrow)"/>
  <line class="flow-line" x1="1160" y1="540" x2="1160" y2="610" marker-end="url(#arrow)"/>

  <text class="service-small" x="455" y="585">routed via Model Router</text>
  <text class="service-small" x="1175" y="585">Foundry IQ retrieval</text>

  <!-- ======================== TIER 3: AZURE SERVICES ======================== -->
  <rect class="tier-band" x="60" y="610" width="1480" height="160" rx="10"/>
  <text class="tier-label" x="80" y="635">AZURE SERVICES</text>

  <!-- Azure OpenAI -->
  <g transform="translate(140, 653)">
    <rect class="tile" width="640" height="100" rx="8"/>
    <!-- Azure OpenAI icon -->
    <rect x="20" y="20" width="60" height="60" rx="10" fill="url(#openai-grad)"/>
    <g transform="translate(36, 36) scale(0.4)">
      <path d="M30 5 L48 18 L48 42 L30 55 L12 42 L12 18 Z" fill="none" stroke="white" stroke-width="2.5"/>
      <circle cx="30" cy="30" r="6" fill="white"/>
    </g>
    <text class="service-name" x="100" y="42">Azure OpenAI · gpt-4.1-mini</text>
    <text class="service-detail" x="100" y="65">One endpoint, automatic model selection, streaming completions</text>
    <text class="badge" x="100" y="84">VIA FOUNDRY MODEL ROUTER</text>
  </g>

  <!-- Azure AI Search -->
  <g transform="translate(820, 653)">
    <rect class="tile" width="640" height="100" rx="8"/>
    <!-- Azure AI Search icon -->
    <rect x="20" y="20" width="60" height="60" rx="10" fill="url(#search-grad)"/>
    <circle cx="46" cy="46" r="11" fill="none" stroke="white" stroke-width="3"/>
    <line x1="54" y1="54" x2="62" y2="62" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <text class="service-name" x="100" y="42">Azure AI Search · Foundry IQ Index</text>
    <text class="service-detail" x="100" y="65">52 chunks · SOC 2 · HIPAA · ISO 27001 · NIST 800-53 · internal policies</text>
    <text class="badge" x="100" y="84">AGENTIC RETRIEVAL, GROUNDED CITATIONS</text>
  </g>

  <!-- ======================== TIER 4: AUTH (cross-cutting) ======================== -->
  <rect class="tier-band" x="60" y="800" width="1480" height="72" rx="10"/>

  <g transform="translate(140, 814)">
    <!-- Entra ID icon -->
    <rect width="44" height="44" rx="8" fill="url(#entra-grad)"/>
    <!-- Shield/identity glyph -->
    <path d="M22 8 L34 12 L34 22 C34 30 22 36 22 36 C22 36 10 30 10 22 L10 12 Z" fill="white" opacity="0.95"/>
    <circle cx="22" cy="20" r="3.5" fill="url(#entra-grad)"/>
    <path d="M16 28 C16 24 18 23 22 23 C26 23 28 24 28 28" fill="url(#entra-grad)"/>
    <text class="service-name" x="60" y="20">Microsoft Entra ID · DefaultAzureCredential</text>
    <text class="service-detail" x="60" y="40">Enterprise SSO across CLI and agents · no API keys anywhere in the codebase</text>
  </g>
  <text class="badge" x="1460" y="838" text-anchor="end">CROSS-CUTTING AUTH</text>

</svg>
</body>
</html>
