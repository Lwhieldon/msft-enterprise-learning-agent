[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default: run unit tests only. Integration tests opt-in with -m integration.
# This keeps the default test run fast and offline-safe for CI / dev loops,
# while explicitly running the slow live-Azure tests on demand.
addopts =
    -v
    --tb=short
    --strict-markers
    -m "not integration"

# Marker definitions
markers =
    integration: tests requiring live Azure API access (slow, costs $, opt-in with -m integration)
    slow: tests that take >30s even when mocked
    live: alias for integration (semantic clarity in test names)
